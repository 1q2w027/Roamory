  <script>
    (function () {
      const beats = window.ROAMORY_BEATS;
      const H = window.ROAMORY_HEADLINE;
      const total = beats[beats.length - 1].end;
      const tl = gsap.timeline({ paused: true });

      // Words of a headline; *…* marks the accent run.
      function fillHeadline(beat) {
        const box = document.querySelector('#h-' + beat.id + ' .box');
        const h1 = box.querySelector('h1');
        let accent = false;
        beat.headline.split(' ').forEach((raw, i) => {
          let word = raw;
          const opens = word.startsWith('*');
          if (opens) { accent = true; word = word.slice(1); }
          const closes = word.endsWith('*');
          if (closes) word = word.slice(0, -1);
          const span = document.createElement('span');
          span.className = 'w' + (accent ? ' accent' : '');
          span.textContent = word;
          if (i > 0) h1.appendChild(document.createTextNode(' '));
          h1.appendChild(span);
          if (closes) accent = false;
        });
        box.querySelector('p').textContent = beat.sub;
      }

      // Per word: blur 6 px → 0 and fade in, a word every 0.09 s; leave word by word with a blur-out.
      function showHeadline(beat) {
        const words = document.querySelectorAll('#h-' + beat.id + ' .w');
        const sub = document.querySelector('#h-' + beat.id + ' p');
        const t0 = beat.start + 0.3;
        tl.fromTo(words, { opacity: 0, filter: 'blur(6px)' },
          { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.09, ease: 'power2.out' }, t0);
        const subAt = Math.min(t0 + words.length * 0.09 + 0.1, beat.start + H.IN - 0.2);
        tl.fromTo(sub, { opacity: 0, filter: 'blur(8px)' },
          { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, subAt);
        const out = beat.end - H.OUT;
        tl.to(words, { opacity: 0, filter: 'blur(6px)', duration: 0.2, stagger: 0.012, ease: 'power2.in' }, out);
        tl.to(sub, { opacity: 0, filter: 'blur(6px)', duration: 0.2, ease: 'power2.in' }, out);
      }

      // One face at a time; the waving arm only with the wave face.
      function setMood(mood, at) {
        tl.set('#root .face', { opacity: 0 }, at);
        tl.set('#face-' + mood, { opacity: 1 }, at);
        tl.set('#roamy-arm', { opacity: mood === 'wave' ? 1 : 0 }, at);
      }

      beats.forEach((b) => {
        fillHeadline(b);
        showHeadline(b);
        setMood(b.mood, b.start);
      });

      // Home poses at t = 0; the loop returns here at the end.
      tl.set('#phone', { rotationY: -18, rotationX: 6, rotationZ: -2, x: 0, y: 0, scale: 1 }, 0);
      tl.set('#glow', { x: 0, y: 0 }, 0);

      // Roamy's idle: a bob that ends where it starts, a wave in the hook, and blinks at fixed times.
      const halves = Math.round(total / 1.5);
      tl.fromTo('#roamy-bob', { y: -8 }, { y: 8, duration: total / halves, ease: 'sine.inOut', yoyo: true, repeat: halves - 1 }, 0);
      tl.fromTo('#roamy-arm', { rotation: -10 }, { rotation: 22, duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 9, svgOrigin: '118 78' }, 0.4);
      [2.6, 6.1, 9.4, 17.8, 21.3, 26.4].forEach((t) => {
        tl.to('#root .eyes', { scaleY: 0.08, duration: 0.07, ease: 'power1.in', svgOrigin: '70 54' }, t);
        tl.to('#root .eyes', { scaleY: 1, duration: 0.09, ease: 'power1.out', svgOrigin: '70 54' }, t + 0.1);
      });

      window.__timelines['film'] = tl;
    })();
  </script>
