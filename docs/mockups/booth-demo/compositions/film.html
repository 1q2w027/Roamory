  <script>
    (function () {
      const beats = window.ROAMORY_BEATS;
      const H = window.ROAMORY_HEADLINE;
      const total = beats[beats.length - 1].end;
      const tl = gsap.timeline({ paused: true });

      // Words of a headline; *…* marks the accent run.
      function fillHeadline(beat) {
        const box = document.querySelector('#h-' + beat.id + ' .box');
        const h1 = box.querySelector('h1');
        let accent = false;
        beat.headline.split(' ').forEach((raw, i) => {
          let word = raw;
          const opens = word.startsWith('*');
          if (opens) { accent = true; word = word.slice(1); }
          const closes = word.endsWith('*');
          if (closes) word = word.slice(0, -1);
          const span = document.createElement('span');
          span.className = 'w' + (accent ? ' accent' : '');
          span.textContent = word;
          if (i > 0) h1.appendChild(document.createTextNode(' '));
          h1.appendChild(span);
          if (closes) accent = false;
        });
        box.querySelector('p').textContent = beat.sub;
      }

      // Per word: blur 6 px → 0 and fade in, a word every 0.09 s; leave word by word with a blur-out.
      function showHeadline(beat) {
        const words = document.querySelectorAll('#h-' + beat.id + ' .w');
        const sub = document.querySelector('#h-' + beat.id + ' p');
        const t0 = beat.start + 0.3;
        tl.fromTo(words, { opacity: 0, filter: 'blur(6px)' },
          { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.09, ease: 'power2.out' }, t0);
        const subAt = Math.min(t0 + words.length * 0.09 + 0.1, beat.start + H.IN - 0.2);
        tl.fromTo(sub, { opacity: 0, filter: 'blur(8px)' },
          { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, subAt);
        const out = beat.end - H.OUT;
        tl.to(words, { opacity: 0, filter: 'blur(6px)', duration: 0.2, stagger: 0.012, ease: 'power2.in' }, out);
        tl.to(sub, { opacity: 0, filter: 'blur(6px)', duration: 0.2, ease: 'power2.in' }, out);
      }

      // One face at a time; the waving arm only with the wave face.
      function setMood(mood, at) {
        tl.set('#root .face', { opacity: 0 }, at);
        tl.set('#face-' + mood, { opacity: 1 }, at);
        tl.set('#roamy-arm', { opacity: mood === 'wave' ? 1 : 0 }, at);
      }

      beats.forEach((b) => {
        fillHeadline(b);
        showHeadline(b);
        if (b.start > 0) setMood(b.mood, b.start); // the first mood is the CSS default
      });

      // Home pose at t = 0, set once outside the timeline; the loop returns here at the end.
      gsap.set('#phone', { rotationY: -18, rotationX: 6, rotationZ: -2, x: 0, y: 0, scale: 1 });

      // Roamy's idle: a bob that ends where it starts, a wave in the hook, and blinks at fixed times.
      const halves = Math.round(total / 1.5);
      tl.fromTo('#roamy-bob', { y: -8 }, { y: 8, duration: total / halves, ease: 'sine.inOut', yoyo: true, repeat: halves - 1 }, 0);
      tl.fromTo('#roamy-arm', { rotation: -10 }, { rotation: 22, duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 9, svgOrigin: '118 78' }, 0.4);
      [2.6, 6.1, 9.4, 17.8, 21.3, 26.4].forEach((t) => {
        tl.to('#root .eyes', { scaleY: 0.08, duration: 0.07, ease: 'power1.in', svgOrigin: '70 54' }, t);
        tl.to('#root .eyes', { scaleY: 1, duration: 0.09, ease: 'power1.out', svgOrigin: '70 54' }, t + 0.1);
      });

      // ---- Globe: orthographic projection of the app's continent outlines, redrawn from a tweened view centre.
      const R = 160, C = 170, RAD = Math.PI / 180;
      const svgNS = 'http://www.w3.org/2000/svg';
      const land = [];
      Object.entries(window.ROAMORY_GLOBE).forEach(([id, polys]) => {
        polys.forEach((poly) => {
          const p = document.createElementNS(svgNS, 'path');
          p.setAttribute('fill', '#3d6b52');
          p.setAttribute('stroke', 'rgba(61,107,82,0.6)');
          document.getElementById('globe-land').appendChild(p);
          land.push({ id, poly, el: p });
        });
      });
      const grid = [];
      for (let lat = -60; lat <= 60; lat += 30) grid.push(Array.from({ length: 73 }, (_, i) => [lat, -180 + i * 5]));
      for (let lon = -180; lon < 180; lon += 30) grid.push(Array.from({ length: 37 }, (_, i) => [-90 + i * 5, lon]));
      const gridEls = grid.map(() => {
        const p = document.createElementNS(svgNS, 'path');
        document.getElementById('globe-grid').appendChild(p);
        return p;
      });
      function project(lat, lon, lat0, lon0) {
        const φ = lat * RAD, λ = (lon - lon0) * RAD, φ0 = lat0 * RAD;
        let x = Math.cos(φ) * Math.sin(λ);
        let y = Math.cos(φ0) * Math.sin(φ) - Math.sin(φ0) * Math.cos(φ) * Math.cos(λ);
        const front = Math.sin(φ0) * Math.sin(φ) + Math.cos(φ0) * Math.cos(φ) * Math.cos(λ) > 0;
        if (!front) { const n = Math.hypot(x, y) || 1; x /= n; y /= n; } // hidden points ride the rim
        return [C + R * x, C - R * y, front];
      }
      const globeView = { lat: 12, lon: -20, lit: 0 };
      function drawGlobe() {
        const { lat, lon, lit } = globeView;
        land.forEach(({ id, poly, el }) => {
          const pts = poly.map(([a, b]) => project(a, b, lat, lon));
          el.setAttribute('d', pts.some((p) => p[2]) ? 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z' : '');
          if (id === 'asia') el.setAttribute('fill', lit > 0.5 ? '#03fc73' : '#3d6b52');
        });
        grid.forEach((line, i) => {
          let d = '', pen = false;
          line.forEach(([a, b]) => {
            const [x, y, front] = project(a, b, lat, lon);
            if (front) { d += (pen ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); pen = true; } else pen = false;
          });
          gridEls[i].setAttribute('d', d);
        });
      }
      drawGlobe();
      const GLOBE_END = { lat: 30, lon: 128 };
      const [kx, ky] = project(35.0, 135.8, GLOBE_END.lat, GLOBE_END.lon);
      gsap.set('#kyoto', { left: kx, top: ky });

      // Ruler ticks for the days step: one per day, a taller tick every week.
      const ticks = document.getElementById('ruler-ticks');
      for (let d = 1; d <= 30; d++) {
        const i = document.createElement('i');
        if (d % 7 === 0) i.className = 'week';
        ticks.appendChild(i);
      }
      const TICK = 34, RULER_MID = 201; // the ruler spans the 402 px screen; its mark is at the middle

      // Each setup screen slides in from the right and out to the left, like the app's step change.
      function stepIn(sel, at) {
        tl.fromTo(sel + ' .in', { x: 70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: 'power3.out' }, at);
      }
      function stepOut(sel, at) {
        tl.to(sel + ' .in', { x: -70, opacity: 0, duration: 0.22, ease: 'power3.in' }, at);
      }
      function tap(sel, at) {
        tl.to(sel, { scale: 0.93, duration: 0.06, ease: 'power2.out' }, at);
        tl.to(sel, { scale: 1, duration: 0.13, ease: 'back.out(2)' }, at + 0.06);
      }

      // ---- Beat 1 · hook: the welcome page builds while the phone turns slowly.
      tl.fromTo('#scr-welcome .in > *', { opacity: 0, y: 26, filter: 'blur(6px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, stagger: 0.1, ease: 'expo.out' }, 0.2);
      tl.fromTo('#scr-welcome .wash', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.1);
      tl.to('#phone', { rotationY: -11, duration: 3.6, ease: 'none' }, 0.2);

      // ---- Beat 2 · setup: push in to a flat phone, then the four steps.
      tl.to('#phone', { rotationY: 0, rotationX: 0, rotationZ: 0, scale: 1.12, x: -20, duration: 0.6, ease: 'power2.inOut' }, 3.8);
      tl.to('#glow', { x: -60, y: 40, duration: 0.6, ease: 'power2.inOut' }, 3.8);
      tl.to('#roamy', { x: -10, y: 600, scale: 0.8, duration: 0.7, ease: 'power3.inOut' }, 3.75);
      tl.to('#scr-welcome .in', { x: -70, opacity: 0, duration: 0.22, ease: 'power3.in' }, 3.85);

      stepIn('#scr-style', 4.05);
      tl.to('#scr-style .dimmable', { opacity: 0.5, duration: 0.25 }, 4.75);
      tl.fromTo('#style-reels .ring', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.75);
      tl.to('#style-reels', { scale: 1.05, duration: 0.18, ease: 'power2.out' }, 4.75);
      tl.to('#style-reels', { scale: 1, duration: 0.3, ease: 'back.out(2)' }, 4.93);
      tap('#btn-style', 5.25);
      stepOut('#scr-style', 5.36);

      stepIn('#scr-globe', 5.6);
      tl.fromTo(globeView, { lat: 12, lon: -20 }, { ...GLOBE_END, duration: 0.85, ease: 'power3.out', onUpdate: drawGlobe }, 5.62);
      tl.fromTo(globeView, { lit: 0 }, { lit: 1, duration: 0.01, onUpdate: drawGlobe }, 6.3);
      tl.fromTo('#kyoto .head, #kyoto .stalk', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: 'bounce.out' }, 6.4);
      tl.fromTo('#kyoto .pulse', { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 2.4, duration: 0.5, ease: 'power2.out' }, 6.55);
      tl.fromTo('#chip-japan, #chip-kyoto', { opacity: 0.35 }, { opacity: 1, duration: 0.15, stagger: 0.1 }, 6.45);
      tl.fromTo('#chip-kyoto', { background: '#22222c', color: '#ffffff' }, { background: '#03fc73', color: '#02200f', duration: 0.15 }, 6.6);
      tl.fromTo('#city-kyoto', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 6.6);
      stepOut('#scr-globe', 6.76);

      stepIn('#scr-trip', 7.0);
      // The card behind shows only its colour until the top card leaves.
      tl.set('#card-friends', { scale: 0.92, y: 18 }, 7.0);
      tl.fromTo('#card-friends > *', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 7.7);
      tl.fromTo('#card-honeymoon', { x: 0, rotation: 0 }, { x: -460, rotation: -18, duration: 0.42, ease: 'power3.in' }, 7.5);
      tl.to('#card-friends', { scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }, 7.75);
      tl.fromTo('#dot-1', { width: 22, background: '#f857a6' }, { width: 9, background: '#22222c', duration: 0.2 }, 7.8);
      tl.fromTo('#dot-2', { width: 9, background: '#22222c' }, { width: 22, background: '#ffc371', duration: 0.2 }, 7.8);
      stepOut('#scr-trip', 8.16);

      stepIn('#scr-days', 8.4);
      tl.set('#ruler-ticks', { x: RULER_MID - TICK / 2 }, 8.4);
      [2, 3, 4].forEach((d, i) => {
        const at = 8.75 + i * 0.2;
        tap('#days-plus', at);
        tl.set('#days-num', { textContent: String(d) }, at + 0.05);
        tl.set('#days-unit', { textContent: 'days' }, at + 0.05);
        tl.to('#ruler-ticks', { x: RULER_MID - TICK / 2 - (d - 1) * TICK, duration: 0.18, ease: 'power2.out' }, at + 0.05);
      });
      tap('#btn-days', 9.55);
      tl.to('#scr-days .in', { opacity: 0, duration: 0.25, ease: 'power2.in' }, 9.75);

      // ---- Beat 3 · start: pull back onto the chest mount, the level settles, the screen goes dark.
      tl.to('#phone', { scale: 1, x: 0, rotationY: -14, rotationX: 4, rotationZ: -7, duration: 0.7, ease: 'power2.inOut' }, 9.85);
      tl.to('#glow', { x: 0, y: 0, duration: 0.7, ease: 'power2.inOut' }, 9.85);
      tl.fromTo('#mount', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 10.0);
      tl.fromTo('#scr-level', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10.0);
      tl.set('#lvl-ok', { opacity: 0 }, 10.0);
      tl.fromTo('#horizon', { rotation: 7, y: 26 }, { rotation: 0, y: 0, duration: 0.9, ease: 'power3.out' }, 10.8);
      tl.to('#phone', { rotationZ: 0, duration: 0.9, ease: 'power3.out' }, 10.8);
      tl.set('#lvl-tilt', { opacity: 0 }, 11.6);
      tl.set('#lvl-ok', { opacity: 1 }, 11.6);
      tl.set('#horizon .line', { background: '#03fc73' }, 11.6);
      tl.set('#horizon .dot', { borderColor: '#03fc73', background: '#03fc73' }, 11.6);
      tl.fromTo('#lvl-ok', { scale: 0.85 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' }, 11.6);
      tl.fromTo('#scr-curtain .black', { opacity: 0 }, { opacity: 1, duration: 0.7, ease: 'power2.inOut' }, 12.2);
      tl.fromTo('#scr-curtain .in', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 12.9);
      tl.to('#phone', { rotationY: -19, duration: 2.0, ease: 'none' }, 13.0);

      // ---- Beat 4 · rolling buffer: frames slide out of the phone at a constant speed; the oldest fade off the left.
      const PHOTOS = ['torii-path', 'bamboo', 'kinkakuji', 'gion-street', 'kamo-river', 'kiyomizu', 'lane', 'torii'];
      const STEP = 256, SPEED = 320, ROLL_FROM = 15.0, ROLL_TO = 24.8;   // px between frames, px/s, s
      const PRESS1 = 20.9, PRESS2 = 23.0, BRACKET_X = 700;
      const xAt = (i, t) => i * STEP - SPEED * (t - ROLL_FROM);           // a frame's left edge on screen
      const track = document.getElementById('strip-track');
      const frames = [];
      for (let i = 0; i < 20; i++) {
        const f = document.createElement('div');
        f.className = 'frame';
        f.style.left = i * STEP + 'px';
        const img = document.createElement('img');
        img.src = 'assets/footage/kyoto-' + PHOTOS[i % PHOTOS.length] + '.jpg';
        f.appendChild(img);
        track.appendChild(f);
        frames.push(f);
      }
      // Saved: the frames inside the bracket at the first press and those that arrive before the second.
      const saved = frames.map((_, i) => xAt(i, PRESS1) + 240 > BRACKET_X && xAt(i, PRESS2) < 1500);

      tl.to('#phone', { scale: 0.62, x: 175, y: -140, rotationY: -16, rotationX: 3, duration: 0.7, ease: 'power2.inOut' }, 14.6);
      tl.to('#phone', { rotationY: -22, duration: 5.6, ease: 'none' }, 15.3);
      tl.to('#roamy', { x: 790, y: -110, scale: 0.7, duration: 0.7, ease: 'power3.inOut' }, 14.6);
      tl.to('#mount', { opacity: 0, duration: 0.4, ease: 'power2.in' }, 14.6);
      tl.fromTo('#strip', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 14.85);
      tl.fromTo(track, { x: 0 }, { x: -SPEED * (ROLL_TO - ROLL_FROM), duration: ROLL_TO - ROLL_FROM, ease: 'none' }, ROLL_FROM);
      frames.forEach((f, i) => {
        if (saved[i]) return;
        // Dim from full to 0.12 while the left edge crosses 620 → 140 px.
        const tA = ROLL_FROM + (i * STEP - 620) / SPEED, tB = ROLL_FROM + (i * STEP - 140) / SPEED;
        const opAt = (t) => t <= tA ? 1 : t >= tB ? 0.12 : 1 - 0.88 * (t - tA) / (tB - tA);
        const from = Math.max(tA, ROLL_FROM);
        if (tB <= ROLL_FROM) { tl.set(f, { opacity: 0.12 }, ROLL_FROM); return; }
        tl.fromTo(f, { opacity: opAt(from) }, { opacity: 0.12, duration: tB - from, ease: 'none' }, from);
      });
      tl.fromTo('#bracket .b-top, #bracket .b-bot', { scaleX: 0, transformOrigin: '100% 50%' },
        { scaleX: (1440 - BRACKET_X) / 1440, duration: 0.6, ease: 'power3.out' }, 15.5);
      tl.fromTo('#bracket-left', { x: 1440, opacity: 0 }, { x: BRACKET_X, opacity: 1, duration: 0.6, ease: 'power3.out' }, 15.5);
      tl.fromTo('#bracket-label', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 15.9);

      // ---- Beat 5 · save: press to start saving, the bracket grows with the new footage, press again to stop.
      tl.to('#roamy', { y: -90, duration: 0.3, ease: 'power3.out' }, 20.0);
      tl.fromTo('.press .disc', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.08, ease: 'back.out(1.8)' }, 20.25);
      [PRESS1, PRESS2].forEach((at) => {
        tl.fromTo('.press .ping', { opacity: 0.95, scale: 0.7 }, { opacity: 0, scale: 1.5, duration: 0.55, ease: 'power2.out' }, at);
        tl.to('.press .disc', { scale: 0.88, duration: 0.07, ease: 'power2.out' }, at);
        tl.to('.press .disc', { scale: 1, duration: 0.2, ease: 'back.out(2.2)' }, at + 0.07);
      });
      frames.forEach((f, i) => {
        if (!saved[i]) return;
        tl.set(f, { borderColor: '#03fc73', boxShadow: '0 0 24px rgba(3,252,115,0.75)' }, PRESS1);
      });
      // The left edge snaps to the oldest saved frame (where it is when the snap ends), then travels with it.
      const leftAtPress = xAt(saved.indexOf(true), PRESS1 + 0.15) - 8;
      tl.to('#bracket-left', { x: leftAtPress, duration: 0.15, ease: 'power2.out' }, PRESS1);
      tl.to('#bracket .b-top, #bracket .b-bot', { scaleX: (1440 - leftAtPress) / 1440, duration: 0.15, ease: 'power2.out' }, PRESS1);
      tl.to('#bracket-left', { x: leftAtPress - SPEED * (PRESS2 - PRESS1 - 0.15), duration: PRESS2 - PRESS1 - 0.15, ease: 'none' }, PRESS1 + 0.15);
      tl.to('#bracket .b-top, #bracket .b-bot', { scaleX: (1440 - leftAtPress + SPEED * (PRESS2 - PRESS1 - 0.15)) / 1440, duration: PRESS2 - PRESS1 - 0.15, ease: 'none' }, PRESS1 + 0.15);
      tl.set('#bracket-label', { textContent: 'saving…' }, PRESS1);
      tl.fromTo('#scr-saving .pill', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, PRESS1 + 0.05);
      tl.set('#saving-time', { textContent: '0:01' }, PRESS1 + 1);
      tl.set('#saving-time', { textContent: '0:02' }, PRESS1 + 2);
      tl.to('#scr-saving .pill', { opacity: 0, scale: 0.9, duration: 0.2, ease: 'power2.in' }, PRESS2 + 0.1);

      // Press 2: the saved clips lift off the strip and fly into a Photos tile.
      tl.fromTo('#gallery-tile .tile', { opacity: 0, scale: 0.8, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: 'back.out(1.6)' }, PRESS2 - 0.05);
      tl.to('#bracket', { opacity: 0, duration: 0.25, ease: 'power2.in' }, PRESS2 + 0.15);
      const FLY = 0.55, tileX = 1086 + 115, tileY = 520 + 72 - 752 - 5;
      let k = 0;
      frames.forEach((f, i) => {
        if (!saved[i]) return;
        const at = PRESS2 + 0.15 + k * 0.05;
        k++;
        const land = at + FLY;
        tl.to(f, {
          x: tileX - (xAt(i, land) + 120), y: tileY - 80, scale: 0.3, opacity: 0,
          duration: FLY, ease: 'power3.inOut',
        }, at);
      });
      tl.to('#gallery-tile .thumb', { scale: 1.08, duration: 0.12, ease: 'power2.out' }, PRESS2 + 0.75);
      tl.to('#gallery-tile .thumb', { scale: 1, duration: 0.3, ease: 'back.out(2)' }, PRESS2 + 0.87);
      tl.to('#strip', { opacity: 0, duration: 0.4, ease: 'power2.in' }, 24.3);
      tl.to('.press .disc', { opacity: 0, scale: 0.7, duration: 0.25, stagger: 0.05, ease: 'power2.in' }, 24.3);

      // ---- Beat 6 · Studio: the clips fly to the laptop, Claude edits in the terminal, the video comes back.
      const PHONE6 = { x: 1760, y: 500 }, MAC_SCREEN = { x: 1300, y: 470 };
      tl.to('#gallery-tile .tile', { opacity: 0, scale: 0.85, duration: 0.25, ease: 'power2.in' }, 24.8);
      tl.to('#phone', { scale: 0.55, x: 375, y: -40, rotationY: -14, rotationX: 2, duration: 0.7, ease: 'power2.inOut' }, 24.7);
      tl.to('#roamy', { x: 470, y: -60, scale: 0.6, duration: 0.7, ease: 'power3.inOut' }, 24.75);
      tl.fromTo('#laptop', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 24.85);
      tl.to('#scr-curtain .in, #scr-curtain .black', { opacity: 0, duration: 0.3 }, 24.7);
      tl.fromTo('#scr-make .in', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, 24.9);
      // Terminal lines type in (a stepped reveal per line).
      [25.15, 25.4, 26.0, 26.4, 26.9, 27.35, 27.8].forEach((at, i) => {
        const ln = document.querySelectorAll('#terminal .ln')[i];
        tl.fromTo(ln, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.28, ease: 'steps(14)' }, at);
      });
      // Six clips arc from the phone into the laptop.
      document.querySelectorAll('#flights .fly:not(#fly-back)').forEach((el, i) => {
        const at = 25.35 + i * 0.07;
        tl.fromTo(el, { x: PHONE6.x - 48, opacity: 0, scale: 0.6 }, { x: MAC_SCREEN.x - 48, duration: 0.6, ease: 'power2.inOut' }, at);
        tl.fromTo(el, { y: PHONE6.y - 32 }, { y: 300, duration: 0.3, ease: 'power2.out' }, at);
        tl.to(el, { y: MAC_SCREEN.y - 32, duration: 0.3, ease: 'power2.in' }, at + 0.3);
        tl.to(el, { opacity: 1, scale: 1, duration: 0.15 }, at);
        tl.to(el, { opacity: 0, scale: 0.5, duration: 0.12, ease: 'power2.in' }, at + 0.5);
      });
      tl.set('#make-stage', { textContent: '✨ Starting Claude · 0:04' }, 26.0);
      tl.set('#make-stage', { textContent: '✨ Cutting the clips · 0:21' }, 26.9);
      tl.set('#make-stage', { textContent: '✨ Rendering · 0:38' }, 27.35);
      tl.set('#make-stage', { textContent: '✨ Done · 0:47' }, 27.8);
      // The finished video flies back and plays in the Gallery.
      tl.fromTo('#fly-back', { x: MAC_SCREEN.x - 48, y: MAC_SCREEN.y - 32, opacity: 0, scale: 0.6 },
        { x: PHONE6.x - 48, y: PHONE6.y - 32, opacity: 1, scale: 1, duration: 0.45, ease: 'power3.inOut' }, 27.55);
      tl.to('#fly-back', { opacity: 0, scale: 1.6, duration: 0.15, ease: 'power2.in' }, 28.0);
      tl.to('#scr-make .in', { opacity: 0, duration: 0.15 }, 27.85);
      tl.fromTo('#scr-gallery .in', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.4)' }, 27.95);
      tl.fromTo('#vid-a', { scale: 1.12, opacity: 1 }, { scale: 1, duration: 1.6, ease: 'none' }, 27.95);
      tl.fromTo('#vid-b', { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power1.inOut' }, 28.6);

      // ---- Loop: everything eases back to the frame-0 state so the cut is invisible.
      tl.to('#laptop', { opacity: 0, y: 40, duration: 0.45, ease: 'power2.in' }, 29.0);
      tl.to('#scr-gallery .in', { opacity: 0, duration: 0.4, ease: 'power2.in' }, 29.1);
      tl.to('#phone', { rotationY: -18, rotationX: 6, rotationZ: -2, x: 0, y: 0, scale: 1, duration: 1.1, ease: 'power2.inOut' }, 28.85);
      tl.to('#roamy', { x: 0, y: 0, scale: 1, duration: 1.0, ease: 'power3.inOut' }, 28.9);
      setMood('wave', 29.5);

      window.__timelines['film'] = tl;
    })();
  </script>
</template>
