# Fly.io settings for the one-container image in cloud/Dockerfile. scripts/deploy.sh builds the image,
# then deploys it with this file, the app name and region from .env, and the settings in .env as env vars.
# Exactly one machine, never stopped: the budget counters and render jobs live in memory.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/render/healthz"
    interval = "10s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "performance-4x"
  memory = "8gb"
